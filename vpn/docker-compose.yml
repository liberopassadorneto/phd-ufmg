services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-vpn
    hostname: ufmg-greenwich-tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_TAILSCALED_EXTRA_ARGS=--socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1055
      - TS_EXTRA_ARGS=--ssh
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    ports:
      - "127.0.0.1:1055:1055"
    restart: unless-stopped