name: phd-ufmg

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phd_ufmg}
      POSTGRES_USER: ${POSTGRES_USER:-phd_ufmg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: ghcr.io/shyim/local-s3:latest
    environment:
      S3_ACCOUNT_ADMIN: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the root .env file}:${S3_SECRET_KEY:?Set S3_SECRET_KEY in the root .env file}"
      S3_DATA_DIR: /data
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
    volumes:
      - s3-data:/data
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-phd_ufmg}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-phd_ufmg}?sslmode=disable"
      DBMATE_STRICT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - .:/workspace
    command:
      - --migrations-dir
      - /workspace/yt-transcript-collector/migrations
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  yt-bootstrap:
    build:
      context: ./yt-transcript-collector
      dockerfile: Dockerfile.bootstrap
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-phd_ufmg}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-phd_ufmg}?sslmode=disable"
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: youtube-transcripts
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the root .env file}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the root .env file}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
  s3-data:
