[project]
name = "claim-extractor-modern-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers==5.5.0",
  "accelerate==1.11.0",
  "bitsandbytes==0.46.1",
  "orbitals==0.6.1",
  "sentencepiece==0.2.1",
  "numpy==1.26.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
