services:
  shared-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.ssh-tunnel
    network_mode: host
    restart: unless-stopped
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent
    volumes:
      - type: bind
        source: ${SSH_AUTH_SOCK:?Start ssh-agent and add the Greenwich SSH key first}
        target: /run/ssh-agent
      - type: bind
        source: ${HOME}/.ssh/known_hosts
        target: /root/.ssh/known_hosts
        read_only: true
    command:
      - -N
      - -o
      - BatchMode=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - -L
      - 127.0.0.1:${POSTGRES_PORT:-15432}:127.0.0.1:${POSTGRES_PORT:-15432}
      - -L
      - 127.0.0.1:${S3_PORT:-19000}:127.0.0.1:${S3_PORT:-19000}
      - ${GREENWICH_SSH_USER:-marcele_araponga}@${GREENWICH_SSH_HOST:-150.164.2.42}
