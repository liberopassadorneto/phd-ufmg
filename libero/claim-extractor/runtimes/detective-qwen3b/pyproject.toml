[project]
name = "claim-extractor-detective-qwen3b-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers==4.57.6",
  "accelerate==1.11.0",
  "bitsandbytes==0.46.1",
  "numpy==1.26.4",
  "psutil==7.1.0",
  "nvidia-ml-py==13.580.82",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
