name: yt-transcript

services:
  postgres:
    image: goliakk/spg:latest
    environment:
      SPG_PG_ADDR: 0.0.0.0:5432
    ports:
      - "${SPG_PORT:-5432}:5432"
    volumes:
      - spg-data:/data
    restart: unless-stopped

  s3:
    # The publisher currently exposes only the latest tag; v1.0.0 is not
    # present in GHCR despite the repository documentation mentioning it.
    image: ghcr.io/shyim/local-s3:latest
    environment:
      S3_ACCOUNT_ADMIN: ${S3_ACCESS_KEY:-local}:${S3_SECRET_KEY:-local-dev-secret-change-me}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    depends_on:
      - postgres
      - s3
    environment:
      DATABASE_URL: host=postgres port=5432 dbname=postgres user=postgres
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: youtube-transcripts
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-secret-change-me}
      AWS_DEFAULT_REGION: us-east-1
    restart: "no"

volumes:
  spg-data:
  s3-data:
